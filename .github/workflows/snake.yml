
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Cloudjexp
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23cba6f7&color_dots=%231e1e2e%23313a4b%2345475a%23cba6f7%23f5c2e7
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23cba6f7&color_dots=%231e1e2e%23313a4b%2345475a%23cba6f7%23f5c2e7

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
